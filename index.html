<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eceef2;
    --text: #14161b;
    --muted: #666d7a;
    --line: #e0e3e9;
    --shadow: 0 1px 2px rgba(20,22,27,.05), 0 6px 18px rgba(20,22,27,.05);
    --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0f13;
      --surface: #171a20;
      --surface-2: #20242c;
      --text: #eef0f4;
      --muted: #98a0ae;
      --line: #272b34;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0f13;
    --surface: #171a20;
    --surface-2: #20242c;
    --text: #eef0f4;
    --muted: #98a0ae;
    --line: #272b34;
    --shadow: none;
  }
  *, *::before, *::after { box-sizing: inherit; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 16px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent, #2563eb); outline-offset: 2px; }

  .app { max-width: 560px; margin: 0 auto; padding: 0 16px 96px; }
  .fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; z-index: 6; }
  .fab .ibtn { width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 4px 14px rgba(0,0,0,.18); }

  /* top bar */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg);
    padding: 14px 0 10px;
  }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 46px; height: 46px; border-radius: 14px; object-fit: cover; flex: none; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .bar h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .bar .sub { font-size: 13px; color: var(--muted); font-weight: 600; }
  .icons { display: flex; gap: 8px; }
  .ibtn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line);
    display: grid; place-items: center; box-shadow: var(--shadow);
  }
  .ibtn[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .ibtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* day tabs */
  .tabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .tab {
    position: relative; padding: 9px 0 8px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-weight: 700; font-size: 13px; color: var(--muted);
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab .n { font-size: 11px; font-weight: 700; opacity: .85; min-height: 14px; }
  .tab.today::after {
    content: ""; position: absolute; top: 5px; right: 6px; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent);
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab.active.today::after { background: #fff; }
  .tab.empty:not(.active) { opacity: .6; }

  /* day header */
  .dayhead { margin: 18px 0 14px; }
  .dayhead .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .dayhead h2 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; color: var(--accent); }
  .badge-today {
    font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 99px;
    background: var(--accent); color: #fff; white-space: nowrap;
  }
  .summary { margin: 6px 0 0; color: var(--muted); font-weight: 600; font-size: 14px; }

  /* occupancy strip */
  .strip { margin: 14px 0 4px; }
  .track { position: relative; height: 12px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .seg { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }
  .nowline { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); border-radius: 2px; }
  .ticks { position: relative; height: 16px; margin-top: 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .ticks span { position: absolute; transform: translateX(-50%); }
  .ticks span:first-child { transform: none; }
  .ticks span:last-child { transform: translateX(-100%); }

  /* class cards */
  .list { display: flex; flex-direction: column; gap: 12px; animation: swap .22s ease-out; }
  @keyframes swap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .list { animation: none; } .tab { transition: none; } }

  .card {
    display: grid; grid-template-columns: 62px 1fr; gap: 14px;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 5px solid var(--accent);
    border-radius: 16px; padding: 14px 14px 14px 12px; box-shadow: var(--shadow);
  }
  .card.done { opacity: .5; }
  .card.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .time { text-align: left; }
  .time .s { font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .time .e { font-size: 14px; font-weight: 600; color: var(--muted); }
  .time .d {
    display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 700;
    color: var(--muted); background: var(--surface-2); padding: 2px 7px; border-radius: 99px;
  }
  .info h3 { margin: 0 0 8px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
  .meta { display: flex; flex-direction: column; gap: 6px; }
  .meta div { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; font-weight: 600; color: var(--muted); }
  .meta svg { flex: none; width: 16px; height: 16px; margin-top: 2px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .meta .teacher { color: var(--text); }
  .room b { color: var(--text); font-weight: 800; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .pill {
    font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px;
    background: color-mix(in srgb, var(--accent) 16%, var(--surface));
    color: color-mix(in srgb, var(--accent) 65%, var(--text));
  }
  .pill.solid { background: var(--accent); color: #fff; }
  .pill.neutral { background: var(--surface-2); color: var(--muted); }
  .pill.warn { background: #fde8c8; color: #8a4b00; }
  :root[data-theme="dark"] .pill.warn { background: #4a3210; color: #ffd8a0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.warn { background: #4a3210; color: #ffd8a0; } }
  .note { margin-top: 10px; font-size: 13px; font-weight: 600; color: #8a4b00; background: #fff3e0; border-radius: 10px; padding: 8px 10px; }
  :root[data-theme="dark"] .note { background: #3a2a10; color: #ffd8a0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .note { background: #3a2a10; color: #ffd8a0; } }

  /* empty */
  .emptybox {
    background: var(--surface); border: 1px dashed var(--line); border-radius: 16px;
    padding: 36px 20px; text-align: center; color: var(--muted); font-weight: 600;
  }
  .emptybox strong { display: block; color: var(--text); font-size: 18px; font-weight: 800; margin-bottom: 4px; }

  /* week view */
  .week { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; animation: swap .22s ease-out; }
  .wday { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .wday > button { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; background: var(--accent); color: #fff; font-weight: 800; font-size: 15px; text-align: left; }
  .wday > button span:last-child { font-size: 12px; font-weight: 700; opacity: .9; }
  .wrow { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; }
  .wrow:first-of-type { border-top: 0; }
  .wrow .t { font-weight: 800; font-variant-numeric: tabular-nums; }
  .wrow .nm { font-weight: 700; }
  .wrow .rm { color: var(--muted); font-size: 13px; font-weight: 600; }
  .wnone { padding: 12px 14px; color: var(--muted); font-size: 14px; font-weight: 600; }

  /* install hint */
  .hint {
    display: flex; gap: 12px; align-items: flex-start; margin: 4px 0 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .hint b { color: var(--text); }
  .hint button { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); font-weight: 800; flex: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <nav class="tabs" id="tabs" aria-label="Günler"></nav>
  </header>
  <div class="hint" id="hint" hidden>
    <div><b>Ana ekrana ekle:</b> Safari'de alttaki Paylaş düğmesine dokun, sonra "Ana Ekrana Ekle" seç. Uygulama gibi açılır.</div>
    <button id="hintClose" aria-label="Kapat">×</button>
  </div>
  <main id="main"></main>
</div>
<div class="fab">

        <button class="ibtn" id="weekBtn" aria-label="Haftalık görünüm" aria-pressed="false">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        </button>
        <button class="ibtn" id="themeBtn" aria-label="Tema">
          <svg viewBox="0 0 24 24" id="themeIcon"></svg>
        </button>
</div>
<div hidden>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Veri ---------- */
  var DAYS = [
    { name: "Pazartesi", short: "Pzt", color: "#2563eb" },
    { name: "Salı",      short: "Sal", color: "#7c3aed" },
    { name: "Çarşamba",  short: "Çar", color: "#059669" },
    { name: "Perşembe",  short: "Per", color: "#cf6a0a" },
    { name: "Cuma",      short: "Cum", color: "#dc2626" },
    { name: "Cumartesi", short: "Cmt", color: "#db2777" },
    { name: "Pazar",     short: "Paz", color: "#0d9488" }
  ];

  var TYPE = { T: "Teori", U: "Uygulama", L: "Laboratuvar" };

  function c(code, type, name, teacher, building, room, start, end, mode) {
    return { code: code, type: type, name: name, teacher: teacher, building: building, room: room, start: start, end: end, mode: mode || "Yüzyüze" };
  }

  var SCHEDULE = [
    // Pazartesi
    [
      c("MEL203", "T", "Analog Elektronik", "Doç.Dr. Ömer ÇOBAN", "MUH004", "D13", "09:00", "10:50"),
      c("TDZ101", "T", "Türk Dili I", "Öğr.Gör.Dr. Bahattin ŞİMŞEK", "", "Sanal Sınıf", "13:00", "14:50", "Uzaktan"),
      c("MEL207", "T", "Ölçme ve Enstrümantasyon", "Dr. Öğr. Üyesi Kaan CAN", "MUH003", "D12", "14:00", "16:50")
    ],
    // Salı
    [
      c("MEL203", "T", "Analog Elektronik", "Doç.Dr. Ömer ÇOBAN", "MUH004", "D13", "12:00", "12:50"),
      c("MEL203", "U", "Analog Elektronik", "Doç.Dr. Ömer ÇOBAN", "MUH004", "D13", "13:00", "13:50")
    ],
    // Çarşamba
    [
      c("MEL209", "L", "Elektrik Devre Laboratuvarı", "Doç.Dr. Emin Argun ORAL", "MUH033", "L4", "09:00", "10:50"),
      c("MEL211", "T", "Sayısal Elektronik", "Dr. Öğr. Üyesi Bahadır ÖZKILBAÇ", "MUH014", "D4", "11:00", "13:50"),
      c("MEL205", "T", "Sinyaller ve Sistemler", "Prof.Dr. İbrahim Yücel ÖZBEK", "MUH005", "D14", "14:00", "16:50")
    ],
    // Perşembe
    [
      c("MEL201", "T", "Elektrik-Elektronik Mühendislik Malzemeleri", "Prof.Dr. Hasan EFEOĞLU", "MUH004", "D13", "14:00", "16:50")
    ],
    // Cuma
    [
      c("FMT171-G", "T", "Diferansiyel Denklemler", "Dr. Öğr. Üyesi Arzu AYKUT", "MUH004", "D13", "09:00", "11:50"),
      c("MEL103", "T", "Bilgisayar Destekli Teknik Resim", "Doç.Dr. Miraç Dilruba GEYİKOĞLU", "MUH035", "TRS2", "14:00", "14:50"),
      c("MEL103", "U", "Bilgisayar Destekli Teknik Resim", "Doç.Dr. Miraç Dilruba GEYİKOĞLU", "MUH035", "TRS2", "15:00", "16:50")
    ],
    [], // Cumartesi
    []  // Pazar
  ];

  /* ---------- Yardımcılar ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function mins(s) { var p = s.split(":"); return +p[0] * 60 + +p[1]; }
  function lessons(cl) { return Math.round((mins(cl.end) - mins(cl.start) + 10) / 60); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]; }); }

  function nowTR() {
    try {
      var parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Europe/Istanbul", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false
      }).formatToParts(new Date());
      var o = {};
      parts.forEach(function (p) { o[p.type] = p.value; });
      var map = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 };
      var h = +o.hour % 24;
      return { day: map[o.weekday], min: h * 60 + +o.minute };
    } catch (e) {
      var d = new Date();
      return { day: (d.getDay() + 6) % 7, min: d.getHours() * 60 + d.getMinutes() };
    }
  }

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var ICON = {
    user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
    pin:  '<svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    book: '<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
    video:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>'
  };

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmt(m) { return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
  // Çok saatlik dersleri saat saat ayrı kutulara böler
  function expand(list) {
    var out = [];
    list.forEach(function (cl) {
      var n = lessons(cl), s0 = mins(cl.start);
      for (var k = 0; k < n; k++) {
        var o = {};
        for (var key in cl) o[key] = cl[key];
        o.start = fmt(s0 + 60 * k);
        o.end = fmt(s0 + 60 * k + 50);
        o.part = k + 1;
        o.parts = n;
        out.push(o);
      }
    });
    return out;
  }
  var SLOTS = SCHEDULE.map(expand);

  /* ---------- Durum ---------- */
  var state = {
    day: 0,
    view: "day",
    theme: safeGet("derslerim:theme") || "auto"
  };
  var today = nowTR();
  state.day = today.day;

  /* ---------- Tema ---------- */
  var THEME_ICONS = {
    auto:  '<circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
    light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    dark:  '<path d="M21 13.5A9 9 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5z"/>'
  };
  var THEME_LABEL = { auto: "Otomatik tema", light: "Açık tema", dark: "Koyu tema" };

  function applyTheme() {
    var r = document.documentElement;
    if (state.theme === "auto") r.removeAttribute("data-theme");
    else r.setAttribute("data-theme", state.theme);
    $("themeIcon").innerHTML = THEME_ICONS[state.theme];
    $("themeBtn").setAttribute("aria-label", THEME_LABEL[state.theme]);
    $("themeBtn").title = THEME_LABEL[state.theme];
    var bg = getComputedStyle(r).getPropertyValue("--bg").trim();
    var m = document.querySelector('meta[name="theme-color"]');
    if (m && bg) m.setAttribute("content", bg);
  }
  $("themeBtn").addEventListener("click", function () {
    var order = ["auto", "light", "dark"];
    state.theme = order[(order.indexOf(state.theme) + 1) % 3];
    safeSet("derslerim:theme", state.theme);
    applyTheme();
  });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onMq = function () { if (state.theme === "auto") applyTheme(); };
    if (mq.addEventListener) mq.addEventListener("change", onMq);
  }

  /* ---------- Çakışma ---------- */
  function conflictsFor(list) {
    var res = list.map(function () { return null; });
    for (var i = 0; i < list.length; i++) {
      for (var j = 0; j < list.length; j++) {
        if (i === j) continue;
        if (mins(list[i].start) < mins(list[j].end) && mins(list[j].start) < mins(list[i].end)) {
          res[i] = list[j];
        }
      }
    }
    return res;
  }

  /* ---------- Çizim ---------- */
  function setAccent(el, d) { el.style.setProperty("--accent", DAYS[d].color); }

  function renderTabs() {
    var nav = $("tabs");
    nav.innerHTML = "";
    DAYS.forEach(function (d, i) {
      var b = document.createElement("button");
      var n = SLOTS[i].length;
      b.className = "tab" + (i === state.day && state.view === "day" ? " active" : "") +
        (i === today.day ? " today" : "") + (n === 0 ? " empty" : "");
      b.setAttribute("aria-label", d.name + (n ? ", " + n + " ders" : ", ders yok"));
      b.setAttribute("aria-current", i === state.day && state.view === "day" ? "true" : "false");
      setAccent(b, i);
      b.innerHTML = "<span>" + d.short + '</span><span class="n">' + (n ? n : "·") + "</span>";
      b.addEventListener("click", function () {
        state.day = i; state.view = "day"; render();
      });
      nav.appendChild(b);
    });
  }

  function cardHTML(cl, status, conflict) {
    var typeLabel = TYPE[cl.type] || cl.type;
    var pills = '<span class="pill solid">' + esc(typeLabel) + "</span>";
    if (cl.mode === "Uzaktan") pills += '<span class="pill">Uzaktan</span>';
    if (status && status.kind === "now") pills += '<span class="pill solid">Şimdi · ' + status.left + " dk kaldı</span>";
    if (status && status.kind === "next") pills += '<span class="pill">Sıradaki</span>';

    var roomHTML;
    if (cl.mode === "Uzaktan") {
      roomHTML = '<div class="room">' + ICON.video + "<span><b>" + esc(cl.room) + "</b></span></div>";
    } else {
      roomHTML = '<div class="room">' + ICON.pin + "<span><b>" + esc(cl.room) + "</b>, " + esc(cl.building) + "</span></div>";
    }

    var note = "";

    return '<article class="card ' + (status ? status.kind : "") + '">' +
      '<div class="time"><div class="s">' + cl.start + '</div><div class="e">' + cl.end + '</div>' +
      (cl.parts > 1 ? '<span class="d">' + cl.part + "/" + cl.parts + ". saat</span>" : "") + "</div>" +
      '<div class="info"><div class="pills">' + pills + "</div>" +
      "<h3>" + esc(cl.name) + "</h3>" +
      '<div class="meta">' +
        '<div class="teacher">' + ICON.user + "<span>" + esc(cl.teacher) + "</span></div>" +
        roomHTML +
        "<div>" + ICON.book + "<span>" + esc(cl.code) + "</span></div>" +
      "</div>" + note + "</div></article>";
  }

  function stripHTML(list, isToday) {
    var from = 8 * 60, to = 18 * 60, span = to - from;
    var segs = list.map(function (cl) {
      var l = (mins(cl.start) - from) / span * 100;
      var w = (mins(cl.end) - mins(cl.start)) / span * 100;
      return '<div class="seg" style="left:' + l.toFixed(2) + '%;width:' + w.toFixed(2) + '%"></div>';
    }).join("");
    var now = "";
    if (isToday && today.min >= from && today.min <= to) {
      now = '<div class="nowline" style="left:' + ((today.min - from) / span * 100).toFixed(2) + '%"></div>';
    }
    var ticks = "";
    for (var h = 8; h <= 18; h += 2) {
      ticks += '<span style="left:' + ((h * 60 - from) / span * 100) + '%">' + (h < 10 ? "0" + h : h) + "</span>";
    }
    return '<div class="strip"><div class="track">' + segs + now + '</div><div class="ticks">' + ticks + "</div></div>";
  }

  function renderDay() {
    var d = state.day, list = SLOTS[d];
    var isToday = d === today.day;
    var main = $("main");
    setAccent(main, d);

    var totalLessons = list.length;
    var summary;
    if (!list.length) summary = "Bu gün dersin yok.";
    else summary = totalLessons + " ders saati, " + list[0].start + " ile " + list[list.length - 1].end + " arası";

    var html = '<section class="dayhead"><div class="row"><h2>' + DAYS[d].name + "</h2>" +
      (isToday ? '<span class="badge-today">Bugün</span>' : "") + "</div>" +
      '<p class="summary">' + summary + "</p>" +
      (list.length ? stripHTML(list, isToday) : "") + "</section>";

    if (!list.length) {
      html += '<div class="emptybox"><strong>Bugün dersin yok</strong>Dinlenmek ya da geride kalan konulara çalışmak için güzel bir gün.</div>';
    } else {
      var nextIdx = -1;
      if (isToday) {
        for (var i = 0; i < list.length; i++) {
          if (mins(list[i].start) > today.min) { nextIdx = i; break; }
        }
      }
      html += '<div class="list">';
      list.forEach(function (cl, i) {
        var st = null;
        if (isToday) {
          if (today.min >= mins(cl.start) && today.min < mins(cl.end) + 10 && today.min < mins(cl.end) + 0) {
            st = { kind: "now", left: mins(cl.end) - today.min };
          } else if (today.min >= mins(cl.end)) {
            st = { kind: "done" };
          } else if (i === nextIdx) {
            st = { kind: "next" };
          }
        }
        html += cardHTML(cl, st, null);
      });
      html += "</div>";
    }
    main.innerHTML = html;
  }

  function renderWeek() {
    var main = $("main");
    main.style.removeProperty("--accent");
    var html = '<div class="week">';
    DAYS.forEach(function (d, i) {
      var list = SLOTS[i];
      html += '<section class="wday" style="--accent:' + d.color + '">' +
        '<button data-day="' + i + '"><span>' + d.name + (i === today.day ? " (bugün)" : "") + "</span><span>" +
        (list.length ? list.length + " ders saati" : "Ders yok") + "</span></button>";
      if (!list.length) html += '<div class="wnone">Ders yok</div>';
      list.forEach(function (cl) {
        html += '<div class="wrow"><div class="t">' + cl.start + "–" + cl.end + "</div><div>" +
          '<div class="nm">' + esc(cl.name) + ' <span class="rm">(' + esc(TYPE[cl.type]) + ")</span></div>" +
          '<div class="rm">' + esc(cl.teacher) + "</div>" +
          '<div class="rm">' + (cl.mode === "Uzaktan" ? esc(cl.room) : esc(cl.room) + ", " + esc(cl.building)) + "</div>" +
          "</div></div>";
      });
      html += "</section>";
    });
    html += "</div>";
    main.innerHTML = html;
    Array.prototype.forEach.call(main.querySelectorAll("button[data-day]"), function (b) {
      b.addEventListener("click", function () {
        state.day = +b.getAttribute("data-day"); state.view = "day"; render(); window.scrollTo(0, 0);
      });
    });
  }

  function render() {
    renderTabs();
    $("weekBtn").setAttribute("aria-pressed", state.view === "week" ? "true" : "false");
    if (state.view === "week") renderWeek(); else renderDay();
  }

  $("weekBtn").addEventListener("click", function () {
    state.view = state.view === "week" ? "day" : "week";
    render();
  });

  /* ---------- Kaydırarak gün değiştir ---------- */
  var sx = 0, sy = 0;
  document.addEventListener("touchstart", function (e) {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (state.view !== "day") return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 45) {
      state.day = (state.day + (dx < 0 ? 1 : 6)) % 7;
      render();
    }
  }, { passive: true });

  /* ---------- Yükleme ipucu ---------- */
  try {
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua);
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    if (isIOS && !standalone && safeGet("derslerim:hint") !== "1") $("hint").hidden = false;
    $("hintClose").addEventListener("click", function () { $("hint").hidden = true; safeSet("derslerim:hint", "1"); });
  } catch (e) {}

  /* ---------- Başlat ---------- */
  applyTheme();
  render();
  setInterval(function () {
    var prev = today;
    today = nowTR();
    if (state.view === "day" && (today.min !== prev.min || today.day !== prev.day)) renderDay();
  }, 30000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
      today = nowTR();
      if (state.view === "day") renderDay();
      renderTabs();
    }
  });
})();
</script>
</body>
</html>
